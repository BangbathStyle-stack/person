    let currentGroup = 'FAKEMAFUCK';
    let page = 1;
    let keyword = '';

    const perPage = 9;

    const home = document.getElementById('home');
    const membersPage = document.getElementById('members');
    const grid = document.getElementById('memberGrid');
    const pagination = document.getElementById('pagination');
    const searchInput = document.getElementById('search');

    function showMembers(group = 'FAKEMAFUCK') {
      currentGroup = group;
      page = 1;
      keyword = '';

      searchInput.value = '';

      document.querySelector('.member-title').textContent = 'MEMBER - ' + group;
      document.querySelector('.join').textContent = 'สมัครเข้า ' + group;

      home.classList.remove('active');
      membersPage.classList.add('active');

      membersPage.scrollTo(0, 0);
      renderMembers();
    }

    function showHome() {
      membersPage.classList.remove('active');
      home.classList.add('active');
    }

    function renderMembers() {
      const list = (memberData[currentGroup] || []).filter(member => {
        return member[0].toLowerCase().includes(keyword.toLowerCase());
      });

      const total = Math.max(1, Math.ceil(list.length / perPage));

      if (page > total) {
        page = total;
      }

      const start = (page - 1) * perPage;
      const shown = list.slice(start, start + perPage);

      grid.innerHTML = shown.length
        ? shown.map(member => createMemberCard(member)).join('')
        : '<div class="empty">ไม่เจอสมาชิกที่ค้นหา</div>';

      pagination.innerHTML = `
        <button class="page-btn nav-btn" ${page === 1 ? 'disabled' : ''} onclick="changePage(${page - 1})">
          ‹ ก่อนหน้า
        </button>

        <div class="page-count">หน้า ${page}/${total}</div>

        <button class="page-btn nav-btn" ${page === total ? 'disabled' : ''} onclick="changePage(${page + 1})">
          ถัดไป ›
        </button>
      `;
    }

   function createMemberCard(member) {
  const name = member[0];
  const image = member[1];
  const fbLink = member[2] || '#';

  return `
    <article class="member-card">
      ${image ? `<img class="avatar" src="${image}" alt="${name}">` : `<div class="empty-avatar"></div>`}
      <div class="member-name">${name}</div>
      <a class="fb" href="${fbLink}" target="_blank">f</a>
    </article>
  `;
}

    window.changePage = function (nextPage) {
      page = nextPage;
      renderMembers();

      membersPage.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    };

    document.querySelectorAll('.cards .open-members').forEach(card => {
      card.onclick = event => {
        event.preventDefault();

        const group = card.querySelector('b').textContent.trim();
        showMembers(group);
      };
    });

    document.getElementById('backHome').onclick = event => {
      event.preventDefault();
      showHome();
    };

    searchInput.oninput = event => {
      keyword = event.target.value;
      page = 1;
      renderMembers();
    };

    const snowChars = ['₿', '฿', '$'];

    function createSnow() {
      const snow = document.createElement('div');

      snow.className = 'snowflake';
      snow.textContent = snowChars[Math.floor(Math.random() * snowChars.length)];

      snow.style.left = Math.random() * 100 + 'vw';
      snow.style.fontSize = (Math.random() * 14 + 10) + 'px';
      snow.style.opacity = Math.random() * .55 + .18;
      snow.style.animationDuration = (Math.random() * 7 + 5) + 's';

      document.body.appendChild(snow);

      setTimeout(() => snow.remove(), 13000);
    }

    setInterval(createSnow, 340);

    const bgMusic = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    const musicBar = document.getElementById('musicBar');
    const musicTitle = document.getElementById('musicTitle');
    const musicPlayer = document.getElementById('musicPlayer');

    function updateMusicTitle() {
      if (!bgMusic.getAttribute('src')) {
        musicTitle.textContent = 'ใส่ลิงก์เพลงใน audio src';
        return;
      }

      const fileName = bgMusic.getAttribute('src').split('/').pop();
      musicTitle.textContent = fileName || 'Background Music';
    }

    musicBtn.onclick = async () => {
      if (!bgMusic.getAttribute('src')) {
        musicTitle.textContent = 'ยังไม่ได้ใส่ไฟล์เพลง';
        return;
      }

      if (bgMusic.paused) {
        await bgMusic.play();
        musicBtn.textContent = 'Ⅱ';
        musicPlayer.classList.add('playing');
      } else {
        bgMusic.pause();
        musicBtn.textContent = '▶';
        musicPlayer.classList.remove('playing');
      }
    };

    bgMusic.ontimeupdate = () => {
      if (!bgMusic.duration) return;

      const percent = (bgMusic.currentTime / bgMusic.duration) * 100;
      musicBar.style.width = percent + '%';
    };

    bgMusic.onended = () => {
      musicBtn.textContent = '▶';
      musicPlayer.classList.remove('playing');
      musicBar.style.width = '0%';
    };

    updateMusicTitle();
  </script>
